<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Grid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .grid-container {
            width: 100%;
            max-width: 900px; /* Maximum width before centering */
            margin: 0 auto;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
        }

        .image-item {
            aspect-ratio: 1 / 1; /* Forces square shape */
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .image-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .image-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Responsive behavior */
        @media (max-width: 768px) {
            .grid-container {
                padding: 0 10px;
            }
            
            .image-grid {
                gap: 15px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .image-grid {
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="image-grid">
            <div class="image-item">
                <img src="https://picsum.photos/400/400?random=1" alt="Random Image 1">
            </div>
            <div class="image-item">
                <img src="https://picsum.photos/400/400?random=2" alt="Random Image 2">
            </div>
            <div class="image-item">
                <img src="https://picsum.photos/400/400?random=3" alt="Random Image 3">
            </div>
            <div class="image-item">
                <img src="https://picsum.photos/400/400?random=4" alt="Random Image 4">
            </div>
            <div class="image-item">
                <img src="https://picsum.photos/400/400?random=5" alt="Random Image 5">
            </div>
            <div class="image-item">
                <img src="https://picsum.photos/400/400?random=6" alt="Random Image 6">
            </div>
            <div class="image-item">
                <img src="https://picsum.photos/400/400?random=7" alt="Random Image 7">
            </div>
            <div class="image-item">
                <img src="https://picsum.photos/400/400?random=8" alt="Random Image 8">
            </div>
            <div class="image-item">
                <img src="https://picsum.photos/400/400?random=9" alt="Random Image 9">
            </div>
        </div>
    </div>
</body>
</html>
